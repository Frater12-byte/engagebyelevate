<!DOCTYPE html>
<html lang="en">
<head>

<title>Lost in Transit — Engage by Elevate</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #08080a; color: #fff; font-family: 'Noto Sans', -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

.scene { position: relative; width: 100%; max-width: 600px; padding: 40px 24px; text-align: center; z-index: 1; }

/* Animated background */
.bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg-glow::before { content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(232,97,42,0.12) 0%, transparent 70%); top: -150px; right: -100px; animation: drift1 8s ease-in-out infinite alternate; }
.bg-glow::after { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(99,140,255,0.06) 0%, transparent 70%); bottom: -100px; left: -80px; animation: drift2 10s ease-in-out infinite alternate; }
@keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(-40px, 30px); } }
@keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(30px, -20px); } }

/* Giant 404 behind everything */
.big-404 {
  font-family: 'Noto Sans', sans-serif;
  font-size: clamp(8rem, 28vw, 14rem);
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px rgba(232,97,42,0.08);
  line-height: 1;
  letter-spacing: -0.06em;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -55%);
  z-index: 0;
  user-select: none;
}

/* Animated compass */
.compass {
  width: 80px; height: 80px; margin: 0 auto 32px; position: relative;
}
.compass-ring {
  width: 80px; height: 80px; border-radius: 50%;
  border: 2px solid rgba(232,97,42,0.15);
  position: relative;
  animation: compass-spin 12s linear infinite;
}
.compass-ring::before {
  content: ''; position: absolute; top: 4px; left: 50%; width: 2px; height: 14px;
  background: #EC672C; transform: translateX(-50%); border-radius: 1px;
}
.compass-ring::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; width: 2px; height: 14px;
  background: rgba(255,255,255,0.1); transform: translateX(-50%); border-radius: 1px;
}
.compass-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #EC672C;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 12px rgba(232,97,42,0.5);
}
@keyframes compass-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Animated path dots */
.path-dots {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 28px;
}
.path-dot {
  width: 4px; height: 4px; border-radius: 50%; background: rgba(232,97,42,0.3);
  animation: dot-pulse 1.5s ease-in-out infinite;
}
.path-dot:nth-child(2) { animation-delay: 0.2s; }
.path-dot:nth-child(3) { animation-delay: 0.4s; }
.path-dot:nth-child(4) { animation-delay: 0.6s; }
.path-dot:nth-child(5) { animation-delay: 0.8s; }
@keyframes dot-pulse { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.8); background: #EC672C; } }

.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: #EC672C; margin-bottom: 16px;
}
h1 {
  font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.1;
  margin-bottom: 16px; letter-spacing: -0.02em;
}
h1 span { color: #EC672C; }
.subtitle {
  color: #a0a0a8; font-size: 1rem; line-height: 1.7; margin-bottom: 36px;
  max-width: 400px; margin-left: auto; margin-right: auto;
}

/* Buttons */
.btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
.btn-404 {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; border-radius: 6px;
  font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 700;
  text-decoration: none; transition: all 0.2s ease; border: none; cursor: pointer;
}
.btn-primary { background: #EC672C; color: #fff; }
.btn-primary:hover { background: #d4551f; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(232,97,42,0.3); }
.btn-ghost {
  background: transparent; color: #a0a0a8;
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-ghost:hover { border-color: #EC672C; color: #EC672C; background: rgba(232,97,42,0.06); }

/* Quick links */
.quick-links {
  display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
  padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.04);
}
.quick-link {
  color: #5a5a65; font-size: 12px; font-weight: 600; text-decoration: none;
  letter-spacing: 0.5px; transition: color 0.2s;
}
.quick-link:hover { color: #EC672C; }

.footer-line {
  margin-top: 40px; font-size: 11px; color: #3a3a42; letter-spacing: 0.5px;
}

/* Logo */
.logo-404 { height: 24px; margin-bottom: 40px; opacity: 0.5; }

@media (max-width: 480px) {
  .btn-row { flex-direction: column; align-items: center; }
  .btn-404 { width: 100%; max-width: 260px; justify-content: center; }
  .quick-links { gap: 16px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="big-404">404</div>

<div class="scene">
  <img src="/img/engage-online-logo.png" alt="Engage Online" class="logo-404">

  <div class="compass">
    <div class="compass-ring"></div>
    <div class="compass-dot"></div>
  </div>

  <div class="path-dots">
    <div class="path-dot"></div>
    <div class="path-dot"></div>
    <div class="path-dot"></div>
    <div class="path-dot"></div>
    <div class="path-dot"></div>
  </div>

  <div class="eyebrow">Page Not Found</div>
  <h1>Lost in <span>Transit</span></h1>
  <p class="subtitle">This destination doesn't exist on our map. Let's get you back on track — your next meeting is waiting.</p>

  <div class="btn-row">
    <a href="/" class="btn-404 btn-primary">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Back to Home
    </a>
    <a href="/dashboard" class="btn-404 btn-ghost">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      My Dashboard
    </a>
  </div>

  <div class="quick-links">
    <a href="/agenda" class="quick-link">Agenda</a>
    <a href="/directory" class="quick-link">Directory</a>
    <a href="/signup.html" class="quick-link">Register</a>
    <a href="/login.html" class="quick-link">Sign In</a>
  </div>

  <div class="footer-line">Engage by Elevate 2026 — June 2-4, Dubai</div>
</div>

</body>
